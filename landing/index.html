<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Circular Fash — Coming Soon</title>
  <meta name="description" content="Circular Fash — one-of-one pre-owned luxury. Coming soon." />
  <meta name="theme-color" content="#FFFFFF" />
  <meta property="og:title" content="Circular Fash — Coming Soon" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* Light direction — matches circularfash.com (white page, near-black ink). */
    :root {
      --bg: #FFFFFF;
      --fg: #1F1F1F;
      --mute: #9CA1B0;
      --line: #1F1F1F;
      --on-accent: #FFFFFF;
      --display: 'Archivo', system-ui, sans-serif;
      --mono: 'Space Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--display);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 26px calc(26px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ---- hero ---- */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      width: 100%;
    }
    .logo {
      width: min(58vw, 250px);
      height: auto;
      display: block;
    }
    /* the single "coming soon" — inverted stamp, same as the app's NEW/SOLD */
    .stamp {
      display: inline-block;
      background: var(--fg);
      color: var(--on-accent);
      font-family: var(--mono);
      font-weight: 700;
      font-size: clamp(13px, 3.6vw, 16px);
      letter-spacing: 5px;
      text-transform: uppercase;
      padding: 12px 18px 12px 23px; /* extra left to balance trailing letter-spacing */
    }

    /* ---- store badges (platform only — timing is the stamp above) ---- */
    .stores {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }
    .store {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid var(--line);
      padding: 15px 16px;
      color: var(--fg);
    }
    .store svg { height: 24px; width: auto; flex: none; display: block; }
    .store .name {
      font-family: var(--display);
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="hero">
      <img class="logo" src="logo.png" alt="Circular Fash" />
      <span class="stamp">Coming Soon</span>

      <div class="stores">
        <span class="store">
          <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="#1F1F1F" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          <span class="name">App Store</span>
        </span>
        <span class="store">
          <svg viewBox="30 336.7 120.9 129.2" aria-hidden="true">
            <path fill="#FFD400" d="M119.2,421.2c15.3-8.4,27-14.8,28-15.3c3.2-1.7,6.5-6.2,0-9.7c-2.1-1.1-13.4-7.3-28-15.3l-20.1,20.2L119.2,421.2z"/>
            <path fill="#FF3333" d="M99.1,401.1l-64.2,64.7c1.5,0.2,3.2-0.2,5.2-1.3c4.2-2.3,48.8-26.7,79.1-43.3L99.1,401.1L99.1,401.1z"/>
            <path fill="#48FF48" d="M99.1,401.1l20.1-20.2c0,0-74.6-40.7-79.1-43.1c-1.7-1-3.6-1.3-5.3-1L99.1,401.1z"/>
            <path fill="#3BCCFF" d="M99.1,401.1l-64.3-64.3c-2.6,0.6-4.8,2.9-4.8,7.6c0,7.5,0,107.5,0,113.8c0,4.3,1.7,7.4,4.9,7.7L99.1,401.1z"/>
          </svg>
          <span class="name">Google Play</span>
        </span>
      </div>
    </main>
  </div>
</body>
</html>
