<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Circular Fash — Device Preview</title>
<style>
  :root {
    --ink: #0E0E0E;
    --surface: #161616;
    --line: #2A2A2A;
    --paper: #FFFFFF;
    --paperDim: #A7A7A7;
    --paperMute: #6E6E6E;
    --hiVis: #E8FF52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c1c1c 0%, var(--ink) 60%);
    color: var(--paper);
    font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---- top toolbar ---- */
  .bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: rgba(14,14,14,0.82);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .brand {
    font-family: "SF Mono", ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    font-size: 11px;
    color: var(--paperDim);
    white-space: nowrap;
  }
  .brand b { color: var(--hiVis); font-weight: 600; }
  .group { display: flex; align-items: center; gap: 8px; }
  .lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--paperMute); }
  button.seg, .seg {
    appearance: none;
    background: var(--surface);
    color: var(--paperDim);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 11px;
    font-size: 12px;
    letter-spacing: .3px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color .12s, color .12s, background .12s;
  }
  .seg:hover { border-color: #3A3A3A; color: var(--paper); }
  .seg.on { background: var(--hiVis); border-color: var(--hiVis); color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  input[type=range] { accent-color: var(--hiVis); width: 120px; }
  .hint { font-size: 11px; color: var(--paperMute); }
  .hint code { color: var(--paperDim); }

  /* ---- stage ---- */
  .stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px 60px;
    overflow: auto;
  }
  .scaler { transform-origin: top center; }

  /* ---- device ---- */
  .phone {
    position: relative;
    background: #0a0a0a;
    border-radius: 62px;
    padding: 14px;
    box-shadow:
      0 0 0 2px #2b2b2e,
      0 0 0 6px #141416,
      0 40px 80px -20px rgba(0,0,0,0.8),
      0 10px 30px -10px rgba(0,0,0,0.6);
  }
  /* side buttons */
  .btn-side { position: absolute; background: #202024; border-radius: 3px; }
  .btn-power { right: -3px; top: 190px; width: 3px; height: 92px; }
  .btn-volup { left: -3px; top: 150px; width: 3px; height: 54px; }
  .btn-voldn { left: -3px; top: 218px; width: 3px; height: 54px; }
  .btn-mute  { left: -3px; top: 96px;  width: 3px; height: 30px; }

  .screen {
    position: relative;
    background: var(--ink);
    border-radius: 48px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* status bar (simulated iOS safe area top) */
  .statusbar {
    height: 50px;
    flex: 0 0 50px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px 0 40px;
    color: var(--paper);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
    z-index: 3;
    position: relative;
  }
  .statusbar .time { font-variant-numeric: tabular-nums; }
  .statusbar .icons { display: flex; align-items: center; gap: 7px; }
  .statusbar svg { display: block; }

  /* dynamic island */
  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 5;
  }

  .frameWrap { flex: 1; position: relative; background: var(--ink); }
  iframe {
    border: 0;
    width: 100%;
    height: 100%;
    background: var(--ink);
    display: block;
  }

  /* home indicator (safe area bottom) */
  .home {
    height: 22px;
    flex: 0 0 22px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home::after {
    content: "";
    width: 132px;
    height: 5px;
    border-radius: 3px;
    background: var(--paper);
    opacity: .9;
  }

  .offline {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 30px;
    color: var(--paperDim);
    background: var(--ink);
    z-index: 2;
  }
  .offline .k { font-size: 26px; }
  .offline code { color: var(--hiVis); }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">CIRCULAR&nbsp;FASH · <b>DEVICE PREVIEW</b></div>

    <div class="group" id="devices">
      <span class="lbl">Device</span>
    </div>

    <div class="group">
      <span class="lbl">Zoom</span>
      <input id="zoom" type="range" min="0.5" max="1" step="0.05" value="0.85" />
      <span class="hint" id="zoomval">85%</span>
    </div>

    <div class="spacer"></div>

    <button class="seg" id="reload">↻ Reload app</button>
    <span class="hint">Serving <code id="srcurl">http://localhost:8081</code></span>
  </div>

  <div class="stage">
    <div class="scaler" id="scaler">
      <div class="phone" id="phone">
        <span class="btn-side btn-mute"></span>
        <span class="btn-side btn-volup"></span>
        <span class="btn-side btn-voldn"></span>
        <span class="btn-side btn-power"></span>
        <div class="screen" id="screen">
          <div class="island"></div>
          <div class="statusbar">
            <span class="time">9:41</span>
            <span class="icons">
              <!-- signal -->
              <svg width="18" height="12" viewBox="0 0 18 12" fill="white"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <!-- wifi -->
              <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.7l1.3-1.4A11.4 11.4 0 0 0 8.5.2 11.4 11.4 0 0 0 .4 3.5l1.3 1.4A9.4 9.4 0 0 1 8.5 2.2Zm0 3.4c1.6 0 3.1.6 4.2 1.7l1.3-1.4a8 8 0 0 0-11 0l1.3 1.4A6 6 0 0 1 8.5 5.6Zm0 3.4c.7 0 1.4.3 1.9.8l-1.9 2-1.9-2c.5-.5 1.2-.8 1.9-.8Z"/></svg>
              <!-- battery -->
              <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="white" stroke-opacity="0.5"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="white"/><rect x="23" y="4" width="1.6" height="4" rx="0.8" fill="white" fill-opacity="0.6"/></svg>
            </span>
          </div>
          <div class="frameWrap">
            <iframe id="app" src="http://localhost:8081" title="Circular Fash app"></iframe>
            <div class="offline" id="offline">
              <div class="k">⌁</div>
              <div>Can't reach the dev server.</div>
              <div class="hint">Start it with <code>npm run web</code> (or <code>npx expo start --web</code>) then hit <b>Reload app</b>.</div>
            </div>
          </div>
          <div class="home"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Logical viewport sizes (points) for notch/Dynamic-Island era iPhones.
  const DEVICES = [
    { id: '13mini', name: 'iPhone 13 mini', w: 375, h: 812 },
    { id: '15',     name: 'iPhone 15',      w: 393, h: 852 },
    { id: '15pro',  name: 'iPhone 15 Pro',  w: 393, h: 852 },
    { id: '15max',  name: 'iPhone 15 Pro Max', w: 430, h: 932 },
  ];
  let current = '15pro';

  const screen = document.getElementById('screen');
  const frame  = document.getElementById('app');
  const scaler = document.getElementById('scaler');
  const phone  = document.getElementById('phone');
  const zoom   = document.getElementById('zoom');
  const zoomval= document.getElementById('zoomval');
  const devicesEl = document.getElementById('devices');

  DEVICES.forEach(d => {
    const b = document.createElement('button');
    b.className = 'seg' + (d.id === current ? ' on' : '');
    b.textContent = d.name.replace('iPhone ', '');
    b.title = d.name + ' — ' + d.w + '×' + d.h;
    b.onclick = () => { current = d.id; applyDevice(); };
    b.dataset.id = d.id;
    devicesEl.appendChild(b);
  });

  function applyDevice() {
    const d = DEVICES.find(x => x.id === current);
    // Screen inner size = device logical size. Status bar + home indicator live
    // INSIDE it (like real iOS safe areas), so the app iframe gets the rest.
    screen.style.width  = d.w + 'px';
    screen.style.height = d.h + 'px';
    [...devicesEl.querySelectorAll('.seg')].forEach(b =>
      b.classList.toggle('on', b.dataset.id === current));
    applyZoom();
  }

  function applyZoom() {
    const z = parseFloat(zoom.value);
    scaler.style.transform = 'scale(' + z + ')';
    zoomval.textContent = Math.round(z * 100) + '%';
  }

  // Auto-fit zoom to the window height on first load.
  function autoFit() {
    const d = DEVICES.find(x => x.id === current);
    const frameH = d.h + 28 + 40; // screen + phone padding + a little air
    const avail = window.innerHeight - 150;
    const z = Math.max(0.5, Math.min(1, avail / frameH));
    zoom.value = z.toFixed(2);
    applyZoom();
  }

  zoom.addEventListener('input', applyZoom);
  document.getElementById('reload').onclick = () => {
    // reassign src to force a fresh load
    frame.src = frame.src;
  };

  // Best-effort "is the dev server up?" check. Cross-origin iframes don't fire
  // a reliable error event, so we ping the URL with no-cors; failure => offline.
  function checkServer() {
    const off = document.getElementById('offline');
    fetch('http://localhost:8081', { mode: 'no-cors' })
      .then(() => { off.style.display = 'none'; })
      .catch(() => { off.style.display = 'flex'; });
  }

  applyDevice();
  autoFit();
  checkServer();
  window.addEventListener('resize', autoFit);
</script>
</body>
</html>
