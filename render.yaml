services:
  - type: web
    name: cf-certificates
    runtime: docker
    region: frankfurt
    plan: starter
    branch: deploy/certificates
    rootDir: live/server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: certificate-pdfs
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cf-certificates-db
          property: connectionString
      - key: SHOPIFY_STORE_DOMAIN
        value: ef7144.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-07
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CERTIFICATE_FROM_EMAIL
        value: Circular Fash <certificates@circularfash.com>
databases:
  - name: cf-certificates-db
    region: frankfurt
    plan: basic-256mb
    databaseName: certificates
    diskSizeGB: 1
    ipAllowList: []
